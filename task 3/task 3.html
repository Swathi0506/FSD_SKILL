<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered List</title>
</head>
<body>

    <h2>Ordered List</h2>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ol>

    <h2>Unordered List</h2>
    <ul>
        <li>Red</li>
        <li>Blue</li>
        <li>Green</li>
    </ul>

</body>
</html>
